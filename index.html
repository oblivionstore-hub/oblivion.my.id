<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RexGames - Unduh Game kesukaan mu di sini</title>
<style>
:root{--bg:#000;--green:#22c55e;--white:#fff;--glass:rgba(255,255,255,.07);--line:rgba(255,255,255,.18);color-scheme:dark}
*,*:before,*:after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--white);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;overflow-x:hidden}
.blob{position:fixed;border-radius:50%;background:var(--green);filter:blur(90px);opacity:.3;z-index:0;pointer-events:none}
.b1{width:260px;height:260px;top:-60px;left:-80px}
.b2{width:300px;height:300px;bottom:10%;right:-120px}
.wrap{position:relative;z-index:1;max-width:980px;margin:0 auto;padding:16px 16px 96px}
.glass{background:var(--glass);border:1px solid var(--line);border-radius:20px;-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}
header{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;margin-bottom:20px}
.logo{font-size:22px;font-weight:800;letter-spacing:.5px}
.logo b{color:var(--green)}
button{font:inherit;cursor:pointer}
.btn{background:var(--green);color:var(--bg);border:0;border-radius:12px;padding:10px 16px;font-weight:700;text-decoration:none;display:inline-block;text-align:center}
.ghost{background:transparent;color:var(--white);border:1px solid var(--line)}
.hero{text-align:center;padding:28px 16px;margin-bottom:20px}
.hero h1{margin:0 0 10px;font-size:clamp(26px,6vw,40px)}
.hero h1 span{color:var(--green)}
#slogan{min-height:48px;margin:0 auto 18px;max-width:520px;transition:opacity .4s;font-size:16px}
#slogan.out{opacity:0}

/* SEARCH glassmorphism + melengkung */
.search{display:block;width:100%;max-width:460px;margin:0 auto;background:var(--glass);color:var(--white);border:1.5px solid var(--green);border-radius:999px;padding:14px 24px;font:inherit;font-weight:600;outline:none;-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);transition:background .2s}
.search::placeholder{color:var(--white);opacity:.6}
.search:focus{background:rgba(255,255,255,.12)}

/* TAB KATEGORI */
.tabs{display:flex;gap:8px;overflow-x:auto;padding:4px 0 16px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;background:var(--glass);color:var(--white);border:1px solid var(--line);border-radius:999px;padding:8px 18px;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.tab.on{background:var(--green);color:var(--bg);border-color:var(--green);font-weight:700}

/* KARTU HORIZONTAL */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
.card{display:flex;align-items:center;gap:12px;padding:12px}
.rank{flex:none;min-width:34px;text-align:center;font-weight:800;font-size:20px;color:var(--green)}
.ico{flex:none;width:68px;height:68px;border-radius:16px;object-fit:cover;background:var(--glass);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:800;color:var(--green)}
.info{flex:1;min-width:0}
.name{font-weight:700;font-size:15px;word-break:break-word}
.cat{font-size:12px;color:var(--green);margin-top:2px}
.stars{display:flex;align-items:center;gap:6px;margin-top:4px;font-size:13px}
.st{letter-spacing:1px}
.st .on{color:var(--green)}
.st .off{color:var(--white);opacity:.25}
.score{opacity:.8;font-size:12px}
select.rate{margin-top:6px;width:auto;max-width:100%;background:var(--glass);color:var(--white);border:1px solid var(--line);border-radius:999px;padding:5px 10px;font:inherit;font-size:12px}
select.rate:disabled{opacity:.6}
.card .btn{flex:none;padding:10px 14px}
.empty{grid-column:1/-1;text-align:center;padding:32px;opacity:.8}
footer{text-align:center;padding:24px;opacity:.7;font-size:13px}

/* TOMBOL GEAR ADMIN */
#adminLink{position:fixed;left:16px;bottom:16px;z-index:5;width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--green);background:var(--glass);border:1px solid var(--green);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);padding:0}
#adminLink svg{width:26px;height:26px}

/* TOAST */
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:20;max-width:90%;padding:12px 18px;border-radius:999px;background:var(--glass);border:1px solid var(--green);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);font-size:13px;text-align:center;opacity:0;pointer-events:none;transition:opacity .3s}
#toast.show{opacity:1}

/* ADMIN */
#modal{position:fixed;inset:0;z-index:10;background:var(--bg);overflow-y:auto;padding:16px;display:none}
#modal.show{display:block}
.panel{max-width:560px;margin:0 auto;padding:18px}
.panel h2{margin:0 0 4px}
label{display:block;font-size:13px;margin:12px 0 4px}
input,select,textarea{width:100%;background:var(--glass);color:var(--white);border:1px solid var(--line);border-radius:12px;padding:11px 12px;font:inherit}
input.search{border:1.5px solid var(--green);border-radius:999px;padding:14px 24px}
select option{background:var(--bg);color:var(--white)}
.row{display:flex;gap:8px;margin-top:16px}
.row>*{flex:1}
.item{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.item .ico{width:44px;height:44px;border-radius:10px;font-size:18px}
.item .t{flex:1;min-width:0;word-break:break-word}
.item button{padding:6px 10px;border-radius:10px}
.note{font-size:12px;opacity:.7;margin:6px 0 0}
#msg{color:var(--green);font-size:13px;min-height:18px;margin-top:10px}
#status{font-size:12px;color:var(--green);margin-top:6px}
</style>
</head>
<body>
<div class="blob b1"></div><div class="blob b2"></div>

<div class="wrap">
  <header class="glass">
    <div class="logo">Rex<b>Games</b></div>
  </header>

  <section class="hero glass">
    <h1>Unduh game <span>kesukaanmu</span> di sini</h1>
    <p id="slogan"></p>
    <input class="search" id="q" type="search" placeholder="Cari game...">
  </section>

  <div class="tabs" id="tabs"></div>
  <div class="grid" id="grid"></div>

  <footer>&copy; RexGames - Unduh Game kesukaan mu di sini</footer>
</div>

<!-- Tombol admin (gear, pojok kiri bawah) -->
<button id="adminLink" aria-label="Admin">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h0a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51h0a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v0a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
</button>

<div id="toast"></div>

<!-- ADMIN PANEL -->
<div id="modal">
  <div class="panel glass">
    <h2>Admin Panel</h2>
    <div id="status"></div>
    <p class="note">Isi nama, gambar (link atau upload), dan link tujuan unduh.</p>

    <label>Nama game</label>
    <input id="fName">

    <label>Kategori</label>
    <select id="fCat"></select>

    <label>Link gambar</label>
    <input id="fImg" placeholder="https://contoh.com/logo.png">

    <label>Atau upload gambar dari perangkat</label>
    <input id="fFile" type="file" accept="image/*">

    <label>Link tujuan (website resmi)</label>
    <input id="fLink" placeholder="https://...">

    <div class="row">
      <button class="btn" id="save">Simpan</button>
      <button class="btn ghost" id="cancel">Batal edit</button>
    </div>
    <div id="msg"></div>

    <h3 style="margin:20px 0 0">Daftar game</h3>
    <div id="adminList"></div>

    <h3 style="margin:20px 0 0">Backup data</h3>
    <p class="note">Export dulu sebelum mengganti kode atau hosting. Import untuk memulihkan semua game.</p>
    <div class="row">
      <button class="btn ghost" id="export">Export JSON</button>
      <button class="btn ghost" id="importBtn">Import JSON</button>
    </div>
    <input id="importFile" type="file" accept="application/json,.json" hidden>

    <div class="row"><button class="btn ghost" id="close">Tutup</button></div>
  </div>
</div>

<script>
/* ====== PENGATURAN ====== */
var ADMIN_PASS = "rex123";   // GANTI password admin

/* Database online Firebase Realtime Database (tanpa garis miring di akhir).
   Contoh: "https://rexgames-default-rtdb.firebaseio.com"
   Kosongkan jika tidak mau pakai. */
var DB_URL = "";

var STORE_KEY  = "rexapk_apps_v1";       // sengaja sama dengan versi lama agar data tidak hilang
var RATE_KEY   = "rexgames_ratings_v1";
var CD_KEY     = "rexgames_cooldown_v1";
var VOTER_KEY  = "rexgames_voter_v1";
var COOLDOWN   = 30*24*60*60*1000;       // 30 hari
var TOP_LIMIT  = 10;                     // jumlah game di kategori Teratas
var PRIOR_MEAN = 3, PRIOR_WEIGHT = 3;    // pengatur skor Teratas (lihat penjelasan)

var CATS = ["MOBA","Sandbox","Launcher","Shooter","RPG","MMORPG","Chess"];
var SLOGANS = [
  "Temukan game kesukaanmu, unduh dalam sekali tap.",
  "Satu tempat untuk semua game impianmu.",
  "Cepat, praktis, dan langsung ke sumber resminya.",
  "Beri rating dan bantu game favoritmu naik ke puncak.",
  "Dari MOBA sampai RPG, semua ada di RexGames."
];
var DEFAULT_APPS = [
  // {"id":"1","name":"Contoh Game","cat":"MOBA","img":"https://...","link":"https://..."}
];
/* ======================== */

var $ = function(i){return document.getElementById(i)};
var tab = "Semua", editId = null, fileData = null, apps = [], ratings = {}, busy = false;

function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
function okUrl(u){return /^https?:\/\//i.test(u)}
function readJSON(k,d){try{var s=localStorage.getItem(k);if(s)return JSON.parse(s)}catch(e){}return d}
function writeJSON(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function toArr(d){if(d==null)return [];if(Array.isArray(d))return d.filter(function(x){return x!=null});return Object.keys(d).map(function(k){return d[k]})}
function clean(list){
  return toArr(list).filter(function(a){return a&&a.name&&okUrl(a.link)}).map(function(a){
    return {id:String(a.id||Date.now()+Math.random()).replace(/[.#$\[\]\/]/g,"_"),name:String(a.name),cat:String(a.cat||CATS[0]),img:a.img||"",link:a.link};
  });
}
var toastT;
function toast(t){var e=$("toast");e.textContent=t;e.classList.add("show");clearTimeout(toastT);toastT=setTimeout(function(){e.classList.remove("show")},3000)}
function setStatus(t){$("status").textContent=t}

/* ID perangkat untuk anti-spam rating */
function voterId(){
  var v=null;try{v=localStorage.getItem(VOTER_KEY)}catch(e){}
  if(!v){v="v"+Date.now().toString(36)+Math.random().toString(36).slice(2,10);try{localStorage.setItem(VOTER_KEY,v)}catch(e){}}
  return v;
}
var VOTER = voterId();

/* ====== PENYIMPANAN GAME ====== */
function readLocal(){var s=readJSON(STORE_KEY,null);return s?clean(s):null}
function writeLocal(){writeJSON(STORE_KEY,apps)}
async function loadRemote(){
  if(!DB_URL) return null;
  try{
    var r=await fetch(DB_URL+"/apps.json",{cache:"no-store"});
    if(!r.ok) throw 0;
    return clean(await r.json());
  }catch(e){return null}
}
async function saveRemote(){
  if(!DB_URL) return true;
  try{
    var r=await fetch(DB_URL+"/apps.json",{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(apps)});
    return r.ok;
  }catch(e){return false}
}
async function persist(msg){
  writeLocal();
  if(DB_URL){
    setStatus("Menyimpan ke database...");
    var ok=await saveRemote();
    setStatus(ok?"Tersimpan di browser + database online.":"Database online gagal, tersimpan di browser saja.");
  } else setStatus("Tersimpan di browser ini. Gunakan Export JSON untuk backup.");
  if(msg) $("msg").textContent=msg;
}

/* ====== RATING ====== */
function normRatings(d){
  var out={};
  if(d==null) return out;
  var keys=Array.isArray(d)?d.map(function(_,i){return i}):Object.keys(d);
  keys.forEach(function(k){if(d[k]) out[String(k)]=d[k]});
  return out;
}
async function loadRatings(){
  ratings=normRatings(readJSON(RATE_KEY,{}));
  if(!DB_URL) return;
  try{
    var r=await fetch(DB_URL+"/ratings.json",{cache:"no-store"});
    if(!r.ok) throw 0;
    ratings=normRatings(await r.json());
    writeJSON(RATE_KEY,ratings);
  }catch(e){}
}
function stats(id){
  var list=toArr(ratings[id]),sum=0,n=0;
  list.forEach(function(x){var v=+x.v;if(v>=1&&v<=5){sum+=v;n++}});
  return {sum:sum,count:n,avg:n?sum/n:0,score:(sum+PRIOR_MEAN*PRIOR_WEIGHT)/(n+PRIOR_WEIGHT)};
}
function lastRate(id){
  var t=0,cd=readJSON(CD_KEY,{});
  if(cd[id]) t=cd[id];
  var r=ratings[id]&&ratings[id][VOTER];
  if(r&&r.t>t) t=r.t;
  return t;
}
function cdLeft(id){var t=lastRate(id);return t?Math.max(0,COOLDOWN-(Date.now()-t)):0}
function days(ms){return Math.ceil(ms/86400000)}

async function rate(a,v){
  if(busy) return;
  v=+v; if(!(v>=1&&v<=5)) return;
  var left=cdLeft(a.id);
  if(left>0){toast("Kamu sudah memberi rating. Coba lagi "+days(left)+" hari lagi.");render();return}
  busy=true;
  try{
    var t=Date.now();
    if(DB_URL){
      var r=await fetch(DB_URL+"/ratings/"+encodeURIComponent(a.id)+"/"+VOTER+".json",{
        method:"PUT",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({v:v,t:{".sv":"timestamp"}})
      });
      if(!r.ok){toast(r.status===401||r.status===403?"Ditolak server. Kamu mungkin masih dalam masa cooldown.":"Gagal mengirim rating.");return}
      var d=await r.json(); if(d&&d.t) t=d.t;
    }
    if(!ratings[a.id]) ratings[a.id]={};
    ratings[a.id][VOTER]={v:v,t:t};
    writeJSON(RATE_KEY,ratings);
    var cd=readJSON(CD_KEY,{});cd[a.id]=t;writeJSON(CD_KEY,cd);
    toast("Terima kasih! Rating "+v+" bintang tersimpan.");
  }catch(e){toast("Gagal mengirim rating. Cek koneksi.")}
  finally{busy=false;render()}
}

/* ====== KARTU ====== */
function icon(a,c){
  if(a.img){
    var im=el("img",c); im.alt=a.name; im.src=a.img;
    im.onerror=function(){im.replaceWith(el("div",c,a.name.charAt(0).toUpperCase()))};
    return im;
  }
  return el("div",c,a.name.charAt(0).toUpperCase());
}
function card(a,rank){
  var c=el("div","card glass");
  if(rank) c.appendChild(el("div","rank","#"+rank));
  c.appendChild(icon(a,"ico"));

  var info=el("div","info");
  info.appendChild(el("div","name",a.name));
  info.appendChild(el("div","cat",a.cat));

  var s=stats(a.id), full=Math.round(s.avg), line=el("div","stars"), st=el("span","st");
  st.appendChild(el("span","on","★".repeat(full)));
  st.appendChild(el("span","off","★".repeat(5-full)));
  line.appendChild(st);
  line.appendChild(el("span","score",s.count?s.avg.toFixed(1)+" ("+s.count+")":"Belum ada rating"));
  info.appendChild(line);

  var left=cdLeft(a.id), sel=el("select","rate");
  var o0=el("option",null,left>0?"Sudah rating ("+days(left)+" hari lagi)":"Beri rating");
  o0.value=""; sel.appendChild(o0);
  for(var i=5;i>=1;i--){var o=el("option",null,"★".repeat(i)+" ("+i+")");o.value=i;sel.appendChild(o)}
  if(left>0) sel.disabled=true;
  sel.onchange=function(){if(sel.value) rate(a,sel.value)};
  info.appendChild(sel);
  c.appendChild(info);

  var l=el("a","btn","Unduh");
  l.href=a.link; l.target="_blank"; l.rel="noopener noreferrer";
  c.appendChild(l);
  return c;
}

function render(){
  var tabs=$("tabs"); tabs.textContent="";
  ["Semua","Teratas"].concat(CATS).forEach(function(c){
    var b=el("button","tab"+(c===tab?" on":""),c);
    b.onclick=function(){tab=c;render()};
    tabs.appendChild(b);
  });
  var q=$("q").value.trim().toLowerCase(), g=$("grid"); g.textContent="";
  var list=apps.filter(function(a){return a.name.toLowerCase().indexOf(q)>-1});

  if(tab==="Teratas"){
    list=list.filter(function(a){return stats(a.id).count>0}).sort(function(x,y){
      var sx=stats(x.id),sy=stats(y.id);
      return sy.score-sx.score||sy.count-sx.count;
    }).slice(0,TOP_LIMIT);
    if(!list.length) g.appendChild(el("div","empty glass","Belum ada game yang dirating."));
    list.forEach(function(a,i){g.appendChild(card(a,i+1))});
    return;
  }
  if(tab!=="Semua") list=list.filter(function(a){return a.cat===tab});
  if(!list.length) g.appendChild(el("div","empty glass",apps.length?"Tidak ditemukan.":"Belum ada game."));
  list.forEach(function(a){g.appendChild(card(a))});
}
$("q").oninput=render;

/* ====== SLOGAN TIAP 5 DETIK ====== */
var si=0;
function slog(){
  var s=$("slogan"); s.classList.add("out");
  setTimeout(function(){s.textContent=SLOGANS[si%SLOGANS.length];si++;s.classList.remove("out")},400);
}
slog(); setInterval(slog,5000);

/* ====== ADMIN ====== */
CATS.forEach(function(c){var o=el("option",null,c);o.value=c;$("fCat").appendChild(o)});

function adminList(){
  var L=$("adminList"); L.textContent="";
  apps.forEach(function(a){
    var r=el("div","item");
    r.appendChild(icon(a,"ico"));
    r.appendChild(el("div","t",a.name+" ("+a.cat+")"));
    var e=el("button","btn ghost","Edit"), d=el("button","btn ghost","Hapus");
    e.onclick=function(){
      editId=a.id; $("fName").value=a.name;
      if(CATS.indexOf(a.cat)>-1) $("fCat").value=a.cat;
      $("fImg").value=(a.img&&a.img.indexOf("data:")!==0)?a.img:"";
      $("fLink").value=a.link;
      fileData=(a.img&&a.img.indexOf("data:")===0)?a.img:null;
      $("msg").textContent="Mengedit: "+a.name;
      $("modal").scrollTo(0,0);
    };
    d.onclick=function(){
      if(confirm("Hapus "+a.name+"?")){
        apps=apps.filter(function(x){return x.id!==a.id});
        persist("Dihapus."); adminList(); render();
      }
    };
    r.appendChild(e); r.appendChild(d); L.appendChild(r);
  });
}
function reset(){
  editId=null; fileData=null;
  ["fName","fImg","fLink","fFile"].forEach(function(i){$(i).value=""});
  $("msg").textContent="";
}
$("adminLink").onclick=function(){
  var p=prompt("Password admin:");
  if(p===ADMIN_PASS){
    $("modal").classList.add("show"); adminList();
    setStatus(DB_URL?"Database online aktif.":"Mode browser saja (DB_URL kosong).");
  } else if(p!==null){ alert("Password salah."); }
};
$("close").onclick=function(){$("modal").classList.remove("show")};
$("cancel").onclick=reset;

$("fFile").onchange=function(){
  var f=this.files[0]; if(!f) return;
  var im=new Image(), u=URL.createObjectURL(f);
  im.onload=function(){
    var s=192, c=document.createElement("canvas"); c.width=c.height=s;
    var x=c.getContext("2d"), m=Math.min(im.width,im.height);
    x.drawImage(im,(im.width-m)/2,(im.height-m)/2,m,m,0,0,s,s);
    fileData=c.toDataURL("image/jpeg",.8);
    URL.revokeObjectURL(u);
    $("msg").textContent="Gambar siap.";
  };
  im.src=u;
};
$("save").onclick=function(){
  var n=$("fName").value.trim(), l=$("fLink").value.trim(), i=$("fImg").value.trim();
  if(!n||!okUrl(l)){$("msg").textContent="Isi nama dan link tujuan (awali dengan http/https).";return}
  if(i&&!okUrl(i)){$("msg").textContent="Link gambar harus diawali http/https.";return}
  var a={id:editId||String(Date.now()),name:n,cat:$("fCat").value,img:fileData||i,link:l};
  if(editId) apps=apps.map(function(x){return x.id===editId?a:x});
  else apps.unshift(a);
  persist("Tersimpan."); adminList(); render();
  editId=null; fileData=null;
  ["fName","fImg","fLink","fFile"].forEach(function(k){$(k).value=""});
};

/* Backup */
$("export").onclick=function(){
  var b=new Blob([JSON.stringify(apps,null,2)],{type:"application/json"});
  var a=document.createElement("a");
  a.href=URL.createObjectURL(b);
  a.download="rexgames-backup-"+new Date().toISOString().slice(0,10)+".json";
  document.body.appendChild(a); a.click(); a.remove();
  $("msg").textContent="Backup diunduh.";
};
$("importBtn").onclick=function(){$("importFile").click()};
$("importFile").onchange=function(){
  var f=this.files[0]; if(!f) return;
  var r=new FileReader();
  r.onload=function(){
    try{
      var d=clean(JSON.parse(r.result));
      if(!d.length){$("msg").textContent="File kosong atau formatnya salah.";return}
      if(!confirm("Ganti semua data dengan "+d.length+" game dari file ini?")) return;
      apps=d; persist("Import berhasil."); adminList(); render();
    }catch(e){$("msg").textContent="File JSON tidak valid."}
  };
  r.readAsText(f); this.value="";
};

/* ====== START ====== */
(async function(){
  var local=readLocal();
  apps=local||clean(DEFAULT_APPS);
  ratings=normRatings(readJSON(RATE_KEY,{}));
  render();                                   // tampil cepat dari data lokal
  var res=await Promise.all([loadRemote(),loadRatings()]);
  var remote=res[0];
  if(remote!==null){
    if(remote.length) apps=remote;
    else if(apps.length) saveRemote();        // database kosong tapi lokal ada -> isi database
    writeLocal();
  }
  render();
})();
</script>
