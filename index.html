<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Novelku & Komiku - Perpustakaan Hangat</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        creamBg: '#fdfbf7',
                        cardWhite: '#ffffff',
                        orangeAcc: '#f97316',
                        brownText: '#451a03',
                        subText: '#78716c'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-creamBg text-brownText min-h-screen font-sans pb-16">

    <!-- Header / Navbar (Nuansa Putih, Oranye, Cokelat) -->
    <header class="sticky top-0 z-50 bg-cardWhite/95 backdrop-blur-md border-b border-orange-100 px-4 py-3 shadow-sm">
        <div class="max-w-md mx-auto flex items-center justify-between">
            <div class="flex items-center space-x-2.5 cursor-pointer" onclick="goHome()">
                <div class="bg-orangeAcc p-2 rounded-xl text-white font-black text-base shadow-md shadow-orange-500/20">
                    <i class="fa-solid fa-book-open"></i>
                </div>
                <div>
                    <h1 class="font-bold text-sm text-brownText leading-tight">Novelku & Komiku</h1>
                    <p class="text-[10px] text-orangeAcc font-medium">Bacaan Seru & Berkualitas</p>
                </div>
            </div>
            <button onclick="openAgeModal()" class="bg-orange-50 hover:bg-orange-100 text-brownText text-xs px-3 py-1.5 rounded-xl border border-orange-200 flex items-center space-x-1.5 transition">
                <i class="fa-solid fa-shield-halved text-orangeAcc"></i>
                <span id="ageBadge" class="font-semibold">Semua Umur</span>
            </button>
        </div>
    </header>

    <!-- Main Container Catalog -->
    <main id="catalogView" class="max-w-md mx-auto px-3 pt-4">
        <!-- Search Input -->
        <div class="mb-3">
            <div class="relative">
                <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-subText">
                    <i class="fa-solid fa-magnifying-glass text-xs"></i>
                </span>
                <input type="text" id="searchInput" oninput="handleSearch()" placeholder="Cari judul novel atau komik pilihan..." 
                    class="w-full bg-cardWhite text-xs text-brownText pl-10 pr-4 py-3 rounded-2xl border border-orange-200 focus:outline-none focus:border-orangeAcc shadow-sm transition">
            </div>
        </div>

        <!-- Genre Filter Pills -->
        <div class="flex space-x-2 overflow-x-auto pb-2 no-scrollbar mb-3">
            <button onclick="filterGenre('Semua', this)" class="genre-btn whitespace-nowrap px-3.5 py-1.5 rounded-xl text-xs font-semibold bg-orangeAcc text-white shadow-sm transition">Semua</button>
            <button onclick="filterGenre('Action', this)" class="genre-btn whitespace-nowrap px-3.5 py-1.5 rounded-xl text-xs font-semibold bg-cardWhite text-brownText border border-orange-200 hover:bg-orange-50 transition">Action</button>
            <button onclick="filterGenre('Isekai', this)" class="genre-btn whitespace-nowrap px-3.5 py-1.5 rounded-xl text-xs font-semibold bg-cardWhite text-brownText border border-orange-200 hover:bg-orange-50 transition">Isekai</button>
            <button onclick="filterGenre('Romance', this)" class="genre-btn whitespace-nowrap px-3.5 py-1.5 rounded-xl text-xs font-semibold bg-cardWhite text-brownText border border-orange-200 hover:bg-orange-50 transition">Romance</button>
            <button onclick="filterGenre('Fantasy', this)" class="genre-btn whitespace-nowrap px-3.5 py-1.5 rounded-xl text-xs font-semibold bg-cardWhite text-brownText border border-orange-200 hover:bg-orange-50 transition">Fantasy</button>
            <button onclick="filterGenre('Horror', this)" class="genre-btn whitespace-nowrap px-3.5 py-1.5 rounded-xl text-xs font-semibold bg-cardWhite text-brownText border border-orange-200 hover:bg-orange-50 transition">Horror</button>
        </div>

        <!-- Book Grid -->
        <div id="bookGrid" class="grid grid-cols-2 gap-3"></div>
    </main>

    <!-- Reader View -->
    <main id="readerView" class="max-w-md mx-auto px-3 pt-3 hidden">
        <button onclick="goHome()" class="mb-3 bg-cardWhite text-brownText hover:bg-orange-50 px-3 py-2 rounded-xl border border-orange-200 text-xs font-semibold flex items-center space-x-1.5 shadow-sm transition">
            <i class="fa-solid fa-arrow-left text-orangeAcc"></i>
            <span>Kembali ke Rak Buku</span>
        </button>

        <div class="bg-cardWhite rounded-2xl border border-orange-200 p-4 shadow-sm">
            <div class="flex justify-between items-center mb-3 border-b border-orange-100 pb-2">
                <div>
                    <h2 id="readTitle" class="text-xs font-bold text-brownText">Judul</h2>
                    <p id="readPageIndicator" class="text-[10px] text-orangeAcc font-medium">Halaman 1</p>
                </div>
                <div class="flex space-x-1.5">
                    <button onclick="changePage(-1)" class="bg-orange-50 text-brownText hover:bg-orange-100 px-3 py-1.5 rounded-xl text-xs font-bold border border-orange-200"><i class="fa-solid fa-chevron-left"></i></button>
                    <button onclick="changePage(1)" class="bg-orangeAcc text-white hover:bg-orange-600 px-3 py-1.5 rounded-xl text-xs font-bold shadow-sm"><i class="fa-solid fa-chevron-right"></i></button>
                </div>
            </div>

            <div id="pageContainer" class="bg-amber-50/50 rounded-xl min-h-[420px] flex flex-col items-center justify-center p-3 border border-orange-100 text-center"></div>

            <div class="flex justify-between items-center mt-3 pt-2 border-t border-orange-100">
                <button onclick="changePage(-1)" class="text-[11px] text-subText font-medium hover:text-brownText"><i class="fa-solid fa-arrow-left mr-1"></i> Sebelumnya</button>
                <span id="pageCounterFooter" class="text-[10px] text-subText font-semibold">Hal 1</span>
                <button onclick="changePage(1)" class="text-[11px] text-orangeAcc font-bold hover:underline">Selanjutnya <i class="fa-solid fa-arrow-right ml-1"></i></button>
            </div>
        </div>
    </main>

    <!-- Modal Filter Umur -->
    <div id="ageModal" class="fixed inset-0 z-50 bg-black/40 backdrop-blur-sm hidden flex items-center justify-center px-4">
        <div class="bg-cardWhite w-full max-w-xs rounded-2xl border border-orange-200 p-4 shadow-xl">
            <h3 class="text-sm font-bold text-brownText mb-1">Pilih Batas Usia Pembaca</h3>
            <p class="text-[11px] text-subText mb-3">Sesuaikan kategori bacaan dengan usia kamu.</p>
            <div class="space-y-2">
                <button onclick="setAgeFilter('Semua')" class="w-full text-left bg-orange-50 hover:bg-orange-100 p-2.5 rounded-xl text-xs font-semibold text-brownText border border-orange-100">Semua Umur</button>
                <button onclick="setAgeFilter('13+')" class="w-full text-left bg-orange-50 hover:bg-orange-100 p-2.5 rounded-xl text-xs font-semibold text-brownText border border-orange-100">Remaja (13+)</button>
                <button onclick="setAgeFilter('18+')" class="w-full text-left bg-orange-50 hover:bg-orange-100 p-2.5 rounded-xl text-xs font-semibold text-brownText border border-orange-100">Dewasa (18+)</button>
            </div>
            <button onclick="closeAgeModal()" class="w-full mt-4 bg-gray-100 hover:bg-gray-200 text-subText text-xs font-semibold py-2.5 rounded-xl">Tutup</button>
        </div>
    </div>

    <!-- Database Cerita Berkualitas (Novel & Komik Berkelanjutan) -->
    <script>
        const libraryData = [
            {
                id: 1,
                title: "Bangkitnya Ksatria Naga Api",
                type: "Komik",
                genre: "Action",
                age: "13+",
                cover: "https://images.unsplash.com/photo-1578632767115-351597cf2477?w=300&q=80",
                totalPages: 5,
                pages: [
                    { type: 'text', title: 'Panel 1: Serangan Fajar', content: 'Di tengah reruntuhan benteng tua, bara api menyala dari pedang sang ksatria muda. Lawannya adalah sesosok jenderal iblis bertanduk hitam.' },
                    { type: 'text', title: 'Panel 2: Bentrokan Pedang', content: 'Kilas balik cahaya merah menyambar cepat. Suara dentingan baja beradu memecah keheningan pagi di lembah kematian.' },
                    { type: 'text', title: 'Panel 3: Kekuatan Tersembunyi', content: 'Napas sang ksatria mulai memburu. Segel naga di lengan kanannya perlahan terbuka, memancarkan energi panas yang luar biasa.' },
                    { type: 'text', title: 'Panel 4: Serangan Pemungkas', content: 'Dengan satu tebasan terakhir berkecepatan tinggi, api melingkar membentuk wujud kepala naga raksasa!' },
                    { type: 'text', title: 'Panel 5: Kemenangan Pertama', content: 'Sang jenderal iblis terpental dan ambruk. Pertempuran pertama dimenangkan, namun perjalanan masih sangat panjang.' }
                ]
            },
            {
                id: 2,
                title: "Catatan Harian Penyihir Isekai",
                type: "Novel",
                genre: "Isekai",
                age: "Semua",
                cover: "https://images.unsplash.com/photo-1544716278-ca5e3f4abd8c?w=300&q=80",
                totalPages: 5,
                pages: [
                    { type: 'text', title: 'Bab 1: Hari Pertama di Dunia Baru', content: 'Hari ini aku terbangun di atas hamparan rumput biru bercahaya. Tidak ada lagi kamar kos atau tumpukan tugas kuliah, yang ada hanyalah hutan misterius dengan pohon setinggi langit.' },
                    { type: 'text', title: 'Bab 2: Menemukan Buku Sihir Kuno', content: 'Saat menyusuri jalan setapak, aku menemukan sebuah buku bersampul kulit hijau tua di dalam gua batu. Ketika kubuka, halaman-halamannya bersinar terang dan meresap ke dalam ingatanku.' },
                    { type: 'text', title: 'Bab 3: Bertemu Makhluk Kecil Bernama Pixie', content: 'Seekor peri kecil bersayap kristal tiba-tiba muncul dan mengejarku sambil marah-marah karena aku tidak sengaja menduduki rumah jamurnya.' },
                    { type: 'text', title: 'Bab 4: Mantra Pertama yang Berhasil', content: 'Berbekal instruksi dari buku kuno, aku mencoba mengarahkan tangan ke arah ranting pohon kering. "Lumen!" seruku, dan sulur api kecil berhasil tercipta di ujung jariku.' },
                    { type: 'text', title: 'Bab 5: Memulai Petualangan Menuju Kota', content: 'Bersama si pixie kecil, aku melangkah meninggalkan hutan sunyi menuju kota sihir pertama untuk mencari cara kembali—atau mungkin, menikmati hidup baru ini.' }
                ]
            },
            {
                id: 3,
                title: "Janji Di Bawah Senja",
                type: "Novel",
                genre: "Romance",
                age: "Semua",
                cover: "https://images.unsplash.com/photo-1518709268805-4e9042af9f23?w=300&q=80",
                totalPages: 3,
                pages: [
                    { type: 'text', title: 'Bab 1: Pertemuan Tak Terduga', content: 'Hujan deras turun tiba-tiba di halte bus sekolah. Hanya ada aku dan dirinya, berdiri berdampingan dalam canggung yang manis.' },
                    { type: 'text', title: 'Bab 2: Secangkir Cokelat Hangat', content: 'Ia menyodorkan kaleng minuman cokelat hangat dari mesin otomatis. Senyum kecilnya membuat hari yang dingin terasa begitu hangat.' },
                    { type: 'text', title: 'Bab 3: Langit Senja Kita', content: 'Sejak hari itu, halte kecil ini menjadi saksi bisu ribuan cerita tawa dan mimpi yang kami rajut bersama hingga senja menjelang.' }
                ]
            }
        ];

        let activeGenre = 'Semua';
        let activeAgeFilter = 'Semua';
        let currentBook = null;
        let currentPage = 0;

        function renderCatalog(dataToRender) {
            const grid = document.getElementById('bookGrid');
            grid.innerHTML = '';
            const filtered = dataToRender.filter(b => {
                const matchGenre = activeGenre === 'Semua' || b.genre === activeGenre;
                const matchAge = activeAgeFilter === 'Semua' || b.age === activeAgeFilter || b.age === 'Semua';
                return matchGenre && matchAge;
            });
            if(filtered.length === 0) {
                grid.innerHTML = `<div class="col-span-2 text-center py-12 text-xs text-subText">Tidak ada cerita ditemukan untuk kategori ini.</div>`;
                return;
            }
            filtered.forEach(book => {
                const card = document.createElement('div');
                card.className = 'bg-cardWhite rounded-2xl border border-orange-100 overflow-hidden flex flex-col justify-between shadow-sm hover:border-orange-300 transition';
                card.innerHTML = `
                    <div>
                        <div class="relative w-full aspect-[3/4] bg-orange-50 overflow-hidden">
                            <img src="${book.cover}" alt="${book.title}" class="w-full h-full object-cover">
                            <span class="absolute top-2 left-2 bg-brownText/80 backdrop-blur-sm text-[9px] text-white font-bold px-2 py-0.5 rounded-md">${book.type}</span>
                            <span class="absolute top-2 right-2 bg-orangeAcc text-[9px] text-white font-bold px-2 py-0.5 rounded-md">${book.age}</span>
                        </div>
                        <div class="p-3">
                            <h3 class="text-xs font-bold text-brownText line-clamp-2 mb-1">${book.title}</h3>
                            <p class="text-[10px] text-subText font-medium">Genre: ${book.genre}</p>
                        </div>
                    </div>
                    <div class="p-3 pt-0">
                        <button onclick="openReader(${book.id})" class="w-full bg-orangeAcc hover:bg-orange-600 text-white text-[11px] font-bold py-2 rounded-xl transition shadow-sm">
                            Baca Cerita
                        </button>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function filterGenre(genre, btnElement) {
            activeGenre = genre;
            document.querySelectorAll('.genre-btn').forEach(btn => {
                btn.classList.remove('bg-orangeAcc', 'text-white', 'shadow-sm');
                btn.classList.add('bg-cardWhite', 'text-brownText', 'border', 'border-orange-200');
            });
            btnElement.classList.remove('bg-cardWhite', 'text-brownText', 'border', 'border-orange-200');
            btnElement.classList.add('bg-orangeAcc', 'text-white', 'shadow-sm');
            renderCatalog(libraryData);
        }

        function handleSearch() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const searched = libraryData.filter(b => b.title.toLowerCase().includes(query));
            renderCatalog(searched);
        }

        function openReader(bookId) {
            currentBook = libraryData.find(b => b.id === bookId);
            currentPage = 0;
            document.getElementById('catalogView').classList.add('hidden');
            document.getElementById('readerView').classList.remove('hidden');
            document.getElementById('readTitle').innerText = currentBook.title;
            updateReaderPage();
            window.scrollTo(0, 0);
        }

        function goHome() {
            document.getElementById('readerView').classList.add('hidden');
            document.getElementById('catalogView').classList.remove('hidden');
        }

        function updateReaderPage() {
            const pageData = currentBook.pages[currentPage];
            const container = document.getElementById('pageContainer');
            document.getElementById('readPageIndicator').innerText = `Halaman ${currentPage + 1} dari ${currentBook.totalPages}`;
            document.getElementById('pageCounterFooter').innerText = `Halaman ${currentPage + 1} / ${currentBook.totalPages}`;

            container.innerHTML = `
                <div class="p-4 text-left w-full">
                    <h4 class="text-xs font-bold text-orangeAcc mb-2 uppercase tracking-wide">${pageData.title || 'Halaman ' + (currentPage + 1)}</h4>
                    <p class="text-xs text-brownText leading-relaxed whitespace-pre-line">${pageData.content}</p>
                </div>
            `;
        }

        function changePage(direction) {
            const newIndex = currentPage + direction;
            if(newIndex >= 0 && newIndex < currentBook.totalPages) {
                currentPage = newIndex;
                updateReaderPage();
                window.scrollTo(0, 0);
            }
        }

        function openAgeModal() { document.getElementById('ageModal').classList.remove('hidden'); }
        function closeAgeModal() { document.getElementById('ageModal').classList.add('hidden'); }
        function setAgeFilter(age) {
            activeAgeFilter = age;
            document.getElementById('ageBadge').innerText = age === 'Semua' ? 'Semua Umur' : `Filter: ${age}`;
            closeAgeModal();
            renderCatalog(libraryData);
        }

        renderCatalog(libraryData);
    </script>
</body>
</html>
