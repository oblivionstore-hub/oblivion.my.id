<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Racun Tech & Gaming - Katalog Afiliasi</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        darkbg: '#0f172a',
                        cardbg: '#1e293b',
                        accent: '#06b6d4',
                        accenthover: '#0891b2',
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome untuk Ikon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-darkbg text-slate-100 min-h-screen font-sans antialiased pb-20">

    <!-- Header / Navbar -->
    <header class="sticky top-0 z-40 bg-darkbg/90 backdrop-blur-md border-b border-slate-800 px-4 py-3">
        <div class="max-w-md mx-auto flex items-center justify-between">
            <div class="flex items-center space-x-2">
                <div class="bg-gradient-to-tr from-accent to-emerald-400 p-2 rounded-xl text-darkbg font-black text-lg shadow-lg shadow-accent/20">
                    <i class="fa-solid fa-bolt"></i>
                </div>
                <div>
                    <h1 class="font-bold text-base text-white leading-tight">Racun Tech & Gaming</h1>
                    <p class="text-xs text-slate-400">Katalog Rekomendasi Pilihan</p>
                </div>
            </div>
            <button onclick="openAdminModal()" class="bg-slate-800 hover:bg-slate-700 text-accent text-xs font-semibold px-3 py-2 rounded-xl border border-slate-700 transition flex items-center space-x-1.5 shadow-sm">
                <i class="fa-solid fa-lock text-[10px]"></i>
                <span>Admin</span>
            </button>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-md mx-auto px-3 pt-4">

        <!-- Search & Filter Section -->
        <div class="mb-4 space-y-2.5">
            <div class="relative">
                <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-400">
                    <i class="fa-solid fa-magnifying-glass text-xs"></i>
                </span>
                <input type="text" id="searchInput" oninput="filterProducts()" placeholder="Cari gadget, aksesoris, atau gear..." 
                    class="w-full bg-cardbg text-xs text-slate-200 pl-10 pr-4 py-2.5 rounded-xl border border-slate-700 focus:outline-none focus:border-accent transition">
            </div>

            <!-- Category Pills -->
            <div class="flex space-x-2 overflow-x-auto pb-1 no-scrollbar">
                <button onclick="filterCategory('Semua', this)" class="cat-btn active-cat whitespace-nowrap px-3 py-1.5 rounded-lg text-xs font-medium bg-accent text-darkbg transition">Semua</button>
                <button onclick="filterCategory('Gadget', this)" class="cat-btn whitespace-nowrap px-3 py-1.5 rounded-lg text-xs font-medium bg-cardbg text-slate-300 border border-slate-700 hover:bg-slate-800 transition">Gadget</button>
                <button onclick="filterCategory('Smartphone', this)" class="cat-btn whitespace-nowrap px-3 py-1.5 rounded-lg text-xs font-medium bg-cardbg text-slate-300 border border-slate-700 hover:bg-slate-800 transition">Smartphone</button>
                <button onclick="filterCategory('Aksesoris', this)" class="cat-btn whitespace-nowrap px-3 py-1.5 rounded-lg text-xs font-medium bg-cardbg text-slate-300 border border-slate-700 hover:bg-slate-800 transition">Aksesoris</button>
                <button onclick="filterCategory('Audio', this)" class="cat-btn whitespace-nowrap px-3 py-1.5 rounded-lg text-xs font-medium bg-cardbg text-slate-300 border border-slate-700 hover:bg-slate-800 transition">Audio</button>
            </div>
        </div>

        <!-- Product Grid (Shopee Style: 2 Columns Mobile) -->
        <div id="productGrid" class="grid grid-cols-2 gap-2.5">
            <!-- Data produk akan dimuat lewat JavaScript dari localStorage -->
        </div>

        <!-- Empty State (Jika produk kosong) -->
        <div id="emptyState" class="hidden text-center py-12 px-4">
            <div class="bg-cardbg w-14 h-14 rounded-full flex items-center justify-center mx-auto mb-3 text-slate-500 text-xl border border-slate-700">
                <i class="fa-solid fa-box-open"></i>
            </div>
            <h3 class="text-sm font-bold text-slate-300">Belum ada produk</h3>
            <p class="text-xs text-slate-500 mt-1">Silakan masuk ke menu Admin (Password: admin123) untuk menambahkan produk afiliasi pertamamu.</p>
        </div>

    </main>

    <!-- Modal Login / Admin Panel -->
    <div id="adminModal" class="fixed inset-0 z-50 bg-black/70 backdrop-blur-sm hidden flex items-center justify-center px-4">
        <div class="bg-cardbg w-full max-w-sm rounded-2xl border border-slate-700 p-5 shadow-2xl relative animate-in fade-in zoom-in duration-200">
            <button onclick="closeAdminModal()" class="absolute top-4 right-4 text-slate-400 hover:text-white">
                <i class="fa-solid fa-xmark text-sm"></i>
            </button>

            <!-- Step 1: Login Password -->
            <div id="loginSection">
                <div class="text-center mb-4">
                    <div class="bg-accent/10 w-10 h-10 rounded-full flex items-center justify-center mx-auto mb-2 text-accent">
                        <i class="fa-solid fa-shield-halved"></i>
                    </div>
                    <h3 class="text-sm font-bold text-white">Autentikasi Admin</h3>
                    <p class="text-xs text-slate-400 mt-0.5">Masukkan password untuk menambah produk</p>
                </div>
                <div class="space-y-3">
                    <div>
                        <label class="block text-[11px] font-medium text-slate-400 mb-1">Password Admin</label>
                        <input type="password" id="adminPasswordInput" placeholder="Masukkan password..." 
                            class="w-full bg-darkbg text-xs text-slate-200 px-3 py-2.5 rounded-xl border border-slate-700 focus:outline-none focus:border-accent">
                    </div>
                    <button onclick="verifyAdmin()" class="w-full bg-accent hover:bg-accenthover text-darkbg text-xs font-bold py-2.5 rounded-xl transition shadow-lg shadow-accent/20">
                        Masuk Panel
                    </button>
                    <p id="loginError" class="text-rose-400 text-[11px] text-center hidden">Password salah! (Gunakan: admin123)</p>
                </div>
            </div>

            <!-- Step 2: Form Tambah Produk (Hidden sebelum login benar) -->
            <div id="productFormSection" class="hidden">
                <div class="flex items-center justify-between mb-3 border-b border-slate-700 pb-2">
                    <h3 class="text-sm font-bold text-white flex items-center space-x-1.5">
                        <i class="fa-solid fa-circle-plus text-accent"></i>
                        <span>Tambah Produk Afiliasi</span>
                    </h3>
                    <button onclick="logoutAdmin()" class="text-rose-400 text-[11px] hover:underline">Keluar</button>
                </div>
                <form id="addProductForm" onsubmit="handleAddNewProduct(event)" class="space-y-2.5">
                    <div>
                        <label class="block text-[10px] font-medium text-slate-400 mb-0.5">Nama Produk</label>
                        <input type="text" id="prodName" required placeholder="Contoh: TWS Gaming TWS-X9" 
                            class="w-full bg-darkbg text-xs text-slate-200 px-2.5 py-2 rounded-lg border border-slate-700 focus:outline-none focus:border-accent">
                    </div>
                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="block text-[10px] font-medium text-slate-400 mb-0.5">Harga (Rp)</label>
                            <input type="text" id="prodPrice" required placeholder="99.000" 
                                class="w-full bg-darkbg text-xs text-slate-200 px-2.5 py-2 rounded-lg border border-slate-700 focus:outline-none focus:border-accent">
                        </div>
                        <div>
                            <label class="block text-[10px] font-medium text-slate-400 mb-0.5">Kategori</label>
                            <select id="prodCategory" class="w-full bg-darkbg text-xs text-slate-200 px-2.5 py-2 rounded-lg border border-slate-700 focus:outline-none focus:border-accent">
                                <option value="Gadget">Gadget</option>
                                <option value="Smartphone">Smartphone</option>
                                <option value="Aksesoris">Aksesoris</option>
                                <option value="Audio">Audio</option>
                            </select>
                        </div>
                    </div>
                    <div>
                        <label class="block text-[10px] font-medium text-slate-400 mb-0.5">URL Gambar Produk</label>
                        <input type="url" id="prodImage" required placeholder="https://link-gambar.com/foto.jpg" 
                            class="w-full bg-darkbg text-xs text-slate-200 px-2.5 py-2 rounded-lg border border-slate-700 focus:outline-none focus:border-accent">
                    </div>
                    <div>
                        <label class="block text-[10px] font-medium text-slate-400 mb-0.5">Link Afiliasi (Shopee/Tokopedia/dll)</label>
                        <input type="url" id="prodAffLink" required placeholder="https://shope.ee/link-afiliasi-kamu" 
                            class="w-full bg-darkbg text-xs text-slate-200 px-2.5 py-2 rounded-lg border border-slate-700 focus:outline-none focus:border-accent">
                    </div>
                    <button type="submit" class="w-full bg-accent hover:bg-accenthover text-darkbg text-xs font-bold py-2.5 rounded-xl transition shadow-md shadow-accent/20 mt-1">
                        Simpan & Pajang Produk
                    </button>
                </form>
            </div>
        </div>
    </div>

    <!-- JavaScript Aplikasi -->
    <script>
        // Inisialisasi Data Produk di localStorage (Kosong sesuai permintaan, siap diisi user)
        let products = JSON.parse(localStorage.getItem('racun_products')) || [];

        let currentCategory = 'Semua';

        function saveToLocalStorage() {
            localStorage.setItem('racun_products', JSON.stringify(products));
        }

        function renderProducts(list = products) {
            const grid = document.getElementById('productGrid');
            const emptyState = document.getElementById('emptyState');
            grid.innerHTML = '';

            if (list.length === 0) {
                emptyState.classList.remove('hidden');
                return;
            } else {
                emptyState.classList.add('hidden');
            }

            list.forEach((p, index) => {
                const card = document.createElement('div');
                card.className = 'bg-cardbg rounded-xl border border-slate-800 overflow-hidden flex flex-col justify-between shadow-sm hover:border-slate-700 transition duration-200';
                card.innerHTML = `
                    <div>
                        <div class="relative w-full aspect-square bg-slate-900 overflow-hidden">
                            <img src="${p.image}" alt="${p.name}" class="w-full h-full object-cover" onerror="this.src='https://images.unsplash.com/photo-1526738549149-8e07eca6c147?w=300&q=80'">
                            <span class="absolute top-1.5 left-1.5 bg-black/60 backdrop-blur-md text-[9px] text-accent font-semibold px-2 py-0.5 rounded-md border border-slate-700/50">${p.category}</span>
                            <button onclick="deleteProduct(${p.id})" class="absolute top-1.5 right-1.5 bg-rose-500/80 hover:bg-rose-600 text-white w-6 h-6 rounded-md flex items-center justify-center text-[10px] transition" title="Hapus Produk">
                                <i class="fa-solid fa-trash"></i>
                            </button>
                        </div>
                        <div class="p-2.5">
                            <h3 class="text-xs font-medium text-slate-200 line-clamp-2 leading-snug mb-1">${p.name}</h3>
                            <div class="text-xs font-bold text-accent">Rp ${p.price}</div>
                        </div>
                    </div>
                    <div class="p-2.5 pt-0">
                        <a href="${p.affLink}" target="_blank" onclick="trackClick(${p.id})" class="w-full bg-emerald-500 hover:bg-emerald-600 text-darkbg text-[11px] font-bold py-1.5 px-2 rounded-lg flex items-center justify-center space-x-1 shadow-sm transition">
                            <i class="fa-solid fa-cart-shopping text-[10px]"></i>
                            <span>Beli Sekarang</span>
                        </a>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // Filter Kategori
        function filterCategory(category, btnElement) {
            currentCategory = category;
            document.querySelectorAll('.cat-btn').forEach(btn => {
                btn.classList.remove('bg-accent', 'text-darkbg');
                btn.classList.add('bg-cardbg', 'text-slate-300', 'border', 'border-slate-700');
            });
            btnElement.classList.remove('bg-cardbg', 'text-slate-300', 'border', 'border-slate-700');
            btnElement.classList.add('bg-accent', 'text-darkbg');

            applyFilter();
        }

        // Filter Pencarian & Kategori Gabungan
        function filterProducts() {
            applyFilter();
        }

        function applyFilter() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = products.filter(p => {
                const matchCategory = currentCategory === 'Semua' || p.category === currentCategory;
                const matchQuery = p.name.toLowerCase().includes(query);
                return matchCategory && matchQuery;
            });
            renderProducts(filtered);
        }

        // Admin Modal Logic
        function openAdminModal() {
            document.getElementById('adminModal').classList.remove('hidden');
        }

        function closeAdminModal() {
            document.getElementById('adminModal').classList.add('hidden');
            document.getElementById('adminPasswordInput').value = '';
            document.getElementById('loginError').classList.add('hidden');
        }

        function verifyAdmin() {
            const pass = document.getElementById('adminPasswordInput').value;
            if (pass === 'admin123') {
                document.getElementById('loginSection').classList.add('hidden');
                document.getElementById('productFormSection').classList.remove('hidden');
                document.getElementById('loginError').classList.add('hidden');
            } else {
                document.getElementById('loginError').classList.remove('hidden');
            }
        }

        function logoutAdmin() {
            document.getElementById('productFormSection').classList.add('hidden');
            document.getElementById('loginSection').classList.remove('hidden');
            document.getElementById('adminPasswordInput').value = '';
        }

        // Tambah Produk Baru
        function handleAddNewProduct(e) {
            e.preventDefault();
            const newProduct = {
                id: Date.now(),
                name: document.getElementById('prodName').value,
                price: document.getElementById('prodPrice').value,
                category: document.getElementById('prodCategory').value,
                image: document.getElementById('prodImage').value,
                affLink: document.getElementById('prodAffLink').value
            };

            products.unshift(newProduct);
            saveToLocalStorage();
            renderProducts();

            // Reset form & tutup modal
            document.getElementById('addProductForm').reset();
            closeAdminModal();
            alert('Produk berhasil ditambahkan dan disimpan secara permanen!');
        }

        // Hapus Produk
        function deleteProduct(id) {
            if (confirm('Yakin ingin menghapus produk ini dari katalog?')) {
                products = products.filter(p => p.id !== id);
                saveToLocalStorage();
                renderProducts();
            }
        }

        function trackClick(id) {
            console.log('Affiliate link clicked for product id:', id);
        }

        // Jalankan render awal saat halaman dimuat
        renderProducts();
    </script>
</body>
</html>
